<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения!</title>
<style>
:root{--bg:#fff7f5;--card:#ffffff;--text:#2b1f22;--muted:#7a6469;--accent:#e8557a;--line:#f3d9df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1417;--card:#281c20;--text:#f7e9ec;--muted:#b99ba2;--line:#3d2a30}}
:root[data-theme="dark"]{--bg:#1c1417;--card:#281c20;--text:#f7e9ec;--muted:#b99ba2;--line:#3d2a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 80px}
header{text-align:center;padding:56px 0 32px}
.emoji{font-size:64px}
h1{font-size:clamp(34px,8vw,56px);margin:12px 0 8px;line-height:1.1;color:var(--accent)}
.sub{color:var(--muted);font-size:19px;margin:0}
.count{display:inline-block;margin-top:20px;padding:8px 18px;border:1px solid var(--line);border-radius:999px;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
section{margin-top:40px}
h2{font-size:24px;margin:0 0 16px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .card{white-space:normal;padding:18px}
.grid b{display:block;color:var(--accent);font-size:22px;margin-bottom:4px}
.sign{text-align:right;margin-top:16px;color:var(--accent);font-style:italic;font-size:20px}
button,input,textarea{font:inherit}
.btn{display:block;margin:32px auto 0;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:18px;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#gear{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
#panel{display:none;position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:10;width:min(320px,calc(100% - 28px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-family:system-ui,sans-serif;font-size:14px}
#panel label{display:block;margin:10px 0 4px;color:var(--muted)}
#panel input,#panel textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
#panel input[type=color]{padding:2px;height:36px}
#panel .row{display:flex;gap:8px;margin-top:12px}
#panel .row button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin:8px -20px 0;padding:4px 20px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;scroll-snap-align:center}
.tabs button:first-child{margin-left:auto}
.tabs button:last-child{margin-right:auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:10px 20px;font-size:16px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:cover}
.tile svg{width:80%;height:80%}
.add{cursor:pointer;color:var(--muted);font-family:system-ui,sans-serif;font-size:14px;text-align:center;padding:8px}
.knife{aspect-ratio:16/9;margin-top:16px;border:1px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--muted);font-family:system-ui,sans-serif;text-align:center;padding:8px}
.knife img{width:100%;height:100%;object-fit:contain}
.food img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.food{text-align:center;font-size:20px}
#tab1,#tab2,#tab3,#tab4,#tab5,#tab6{animation:tabin .5s cubic-bezier(.22,.8,.3,1) both}
@keyframes tabin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.tabs button{transition:background .3s,color .3s,border-color .3s,transform .2s}
.tabs button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){#tab1,#tab2,#tab3,#tab4,#tab5,#tab6{animation:none}}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .6s,transform .6s}
#gate.open{opacity:0;transform:scale(1.08);pointer-events:none}
.gbox{width:100%;max-width:380px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px}
.gbox .lock{font-size:52px}
.gbox h2{margin:8px 0}
.gbox p{color:var(--muted);margin:0 0 16px}
.gbox input{width:100%;padding:12px 14px;font-size:18px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.gbox .btn{margin-top:14px;width:100%}
#gMsg{min-height:24px;margin:12px 0 0;color:var(--accent);font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#mus{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
#trk{position:fixed;left:66px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
#toast{position:fixed;left:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:14px system-ui,sans-serif;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.wrap{position:relative;z-index:1}
.card{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* ===== Новый дизайн: тёмный, неоновое голубое свечение, «стеклянные» карточки ===== */
:root:root:root{--bg:#02060c;--card:rgba(14,28,44,.55);--text:#eaf6ff;--muted:#8fa7bd;--accent:#2dd4ff;--line:rgba(120,200,255,.16);color-scheme:dark}
html{background:#02060c}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
#wall{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(60% 45% at 50% 108%,rgba(34,190,255,.5),transparent 70%),radial-gradient(55% 35% at 50% -5%,rgba(20,100,180,.55),transparent 70%),radial-gradient(40% 30% at 8% 55%,rgba(10,70,140,.4),transparent 70%),radial-gradient(35% 25% at 95% 40%,rgba(10,90,160,.3),transparent 70%),#02060c}
#wall::before{content:"";position:absolute;inset:-5%;filter:blur(3px);animation:bok 8s ease-in-out infinite alternate;background:radial-gradient(circle 14px at 12% 78%,rgba(80,220,255,.5),transparent 70%),radial-gradient(circle 22px at 24% 62%,rgba(60,140,255,.4),transparent 70%),radial-gradient(circle 10px at 38% 85%,rgba(150,230,255,.5),transparent 70%),radial-gradient(circle 18px at 55% 70%,rgba(70,200,255,.4),transparent 70%),radial-gradient(circle 26px at 72% 82%,rgba(60,130,255,.4),transparent 70%),radial-gradient(circle 12px at 85% 66%,rgba(140,220,255,.5),transparent 70%),radial-gradient(circle 16px at 93% 88%,rgba(80,210,255,.5),transparent 70%),radial-gradient(circle 20px at 8% 30%,rgba(90,150,255,.3),transparent 70%),radial-gradient(circle 14px at 90% 18%,rgba(120,210,255,.35),transparent 70%)}
@keyframes bok{from{opacity:.5;transform:translateY(0)}to{opacity:1;transform:translateY(-8px)}}
h1{background:linear-gradient(180deg,#ffffff,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:-.035em}
.emoji{filter:drop-shadow(0 0 26px rgba(45,212,255,.65))}
.sub{color:var(--muted)}
.count{background:rgba(45,212,255,.07);border-color:var(--line)}
h2{font-weight:600;letter-spacing:-.02em;font-size:28px}
section h2::before{content:"";display:block;width:58px;height:24px;margin:0 auto 14px;border:1px solid var(--line);border-radius:999px;background:radial-gradient(circle at 17px 50%,var(--accent) 3px,transparent 4.5px),rgba(45,212,255,.08)}
.card{background:linear-gradient(160deg,rgba(40,100,160,.28),rgba(6,16,28,.62));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 50px -24px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.grid b{color:var(--accent);text-shadow:0 0 18px rgba(45,212,255,.6)}
.sign{color:var(--accent)}
.btn{background:linear-gradient(180deg,#6be6ff,#1fb2e6);color:#022231;font-weight:600;box-shadow:0 0 32px rgba(45,212,255,.4)}
.tabs button{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--text);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs button.on{background:linear-gradient(180deg,#6be6ff,#1fb2e6);color:#022231;border-color:transparent;font-weight:600;box-shadow:0 0 24px rgba(45,212,255,.35)}
.tile{background:rgba(14,28,44,.5);border-radius:20px}
.knife{border-color:rgba(120,200,255,.3);border-radius:20px;background:rgba(14,28,44,.35)}
#gate{background:radial-gradient(60% 45% at 50% 108%,rgba(34,190,255,.5),transparent 70%),radial-gradient(55% 35% at 50% -5%,rgba(20,100,180,.55),transparent 70%),#02060c}
.gbox{background:linear-gradient(160deg,rgba(40,100,160,.3),rgba(6,16,28,.7));border-radius:24px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.gbox input,#panel input,#panel textarea{background:rgba(255,255,255,.05);color:var(--text)}
#panel{background:#08121d}
#gear,#mus,#trk,#toast{background:rgba(10,22,36,.85)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.trow:last-child{border-bottom:0}
.sw{flex:none;width:46px;height:26px;padding:0;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;cursor:pointer;transition:background .25s,box-shadow .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#cfe8f7;transition:transform .25s,background .25s}
.sw.on{background:var(--accent);box-shadow:0 0 16px rgba(45,212,255,.45)}
.sw.on::after{transform:translateX(20px);background:#fff}
#togMsg{min-height:22px;margin-top:12px;text-align:center;color:var(--accent);font-size:15px}
</style>
</head>
<body>
<div id="wall"></div><canvas id="rain"></canvas>
<canvas id="cv"></canvas>
<div id="gate"><div class="gbox" id="gBox"><div class="lock">🔐</div><h2 id="gTitle"></h2><p id="gHint"></p><input id="gIn" placeholder="Пароль" autocomplete="off"><button class="btn" id="gGo">Открыть</button><p id="gMsg"></p></div></div>
<div class="wrap">
  <header>
    <div class="emoji" id="emoji"></div>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="count" id="count" hidden></div>
  </header>
  <nav class="tabs"><button class="on" data-t="1" id="t1"></button><button data-t="2" id="t2"></button><button data-t="3" id="t3"></button><button data-t="4" id="t4"></button><button data-t="5" id="t5"></button><button data-t="6" id="t6"></button></nav>
  <div id="tab1">
  <section><h2 id="msgH"></h2><div class="card"><span id="message"></span><div class="sign" id="sign"></div></div></section>
  <section><h2 id="reasonsH"></h2><div class="grid" id="reasons"></div></section>
  <section><h2 id="wishesH"></h2><div class="card" id="wishes"></div></section>
  <section><h2 id="togH"></h2><div class="card"><div id="tog"></div><div id="togMsg"></div></div></section>
  <section><h2 id="galH"></h2><div class="gal" id="gal"></div></section>
  <button class="btn" id="boom"></button>
  </div>
  <div id="tab2" hidden>
    <section><h2 id="knifeH"></h2><div class="card"><span id="knifeText"></span><div class="sign" id="sign2"></div></div><div class="knife" id="knife"></div></section>
  </div>
  <div id="tab3" hidden>
    <section><h2 id="foodH"></h2><div class="grid" id="food"></div><div class="sign" id="sign3"></div></section>
  </div>
  <div id="tab4" hidden>
    <section><h2 id="vibeH"></h2><div class="card"><span id="vibeText"></span><div class="sign" id="sign4"></div></div><div class="grid" id="vibe" style="margin-top:16px"></div></section>
  </div>
  <div id="tab5" hidden>
    <section><h2 id="loveH"></h2><div class="card"><span id="loveText"></span><div class="sign" id="sign5"></div></div></section>
    <section><h2 id="promH"></h2><div class="grid" id="prom"></div></section>
    <button class="btn" id="sadBtn"></button>
    <div class="card" id="sadMsg" hidden style="margin-top:16px;text-align:center"></div>
  </div>
  <div id="tab6" hidden>
    <section><h2 id="childH"></h2><div class="card"><span id="childText"></span><div class="sign" id="sign6"></div></div></section>
    <section><h2 id="memH"></h2><div class="grid food" id="mem"></div></section>
  </div>
</div>

<button id="mus" aria-label="Музыка">🎵</button><button id="trk" aria-label="Следующий трек">⏭</button><div id="toast"></div>
<button id="gear" aria-label="Настройки">⚙️</button>
<div id="panel">
  <label>Имя</label><input id="fName">
  <label>Подзаголовок</label><input id="fSub">
  <label>Дата дня рождения (для отсчёта)</label><input id="fDate" type="date">
  <label>Главное письмо</label><textarea id="fMsg" rows="6"></textarea>
  <label>Акцентный цвет</label><input id="fColor" type="color">
  <div class="row"><button id="save">Применить</button><button id="reset">Сбросить</button></div>
</div>

<script>
/* ============ НАСТРОЙКИ: меняйте только этот блок ============ */
const CONFIG = {
  name: "Юня",
  emoji: "🎂",
  titleTemplate: "С днём рождения, {name}!",
  subtitle: "Сегодня твой день, и он весь для тебя",
  birthday: "",            // например "2026-11-05" — покажет отсчёт дней
  accent: "#2dd4ff",
  messageHeading: "Тебе",
  message: "Юня, ты делаешь мои дни светлее просто тем, что ты рядом.\nХочу, чтобы ты никогда не грустила. А если вдруг станет грустно, знай: я рядом, обниму и обязательно рассмешу.",
  signature: "Твой ❤️",
  reasonsHeading: "Почему я тебя люблю",
  reasons: [
    ["01", "Твоя улыбка"],
    ["02", "Твоя доброта"],
    ["03", "Наш общий смех"],
    ["04", "Ты всегда поддерживаешь меня"]
  ],
  wishesHeading: "Мои пожелания",
  wishes: "Юня, пусть грусть всегда обходит тебя стороной.\nПусть исполняются самые смелые желания, а рядом будут те, кто тебя любит.",
  buttonText: "Сюрприз 🎉",
  tab1: "Поздравление",
  tab2: "Пожелание 🗡️",
  tab3: "Любимая еда 🍑",
  tab4: "Твой вайб 🌙",
  tab5: "От меня 💌",
  tab6: "Твоё детство 🧸",
  childHeading: "Твоё детство",
  childText: "Когда-то ты была маленькой Юней, и я бы очень хотел увидеть тебя тогда.\nНо я счастлив, что та девочка выросла в человека, которого я так люблю.",
  memoriesHeading: "Тёплые воспоминания",
  memories: [["🧸", "Любимая игрушка"], ["🌳", "Лето во дворе"], ["📺", "Мультики по утрам"], ["🍭", "Сладости из детства"]],
  togglesHeading: "Настройки Юни ⚙️",
  togglesNote: "Попробуй переключить 😉",
  // [название, включено?, что запрещено ("on"/"off"/null), сообщение при запрете, действие]
  toggles: [
    ["Улыбаться 😊", true, "off", "Эту функцию нельзя отключить 😌"],
    ["Грустить 😢", false, "on", "Грусть недоступна в твоей версии 🚫"],
    ["Любить Виту 💖", true, "off", "Ошибка: функция встроена навсегда 🤭"],
    ["Обнимашки 🤗", true, null, ""],
    ["Дождик за окном 🌧️", true, null, "", "rain"]
  ],
  loveHeading: "Кое-что от меня",
  loveText: "Юня, я тебя безумно люблю.\nНикогда не уходи от меня, прошу тебя.\n\nС тобой мне спокойно и тепло, и я хочу, чтобы так было всегда.",
  promisesHeading: "Я обещаю",
  promises: [["01", "Всегда быть рядом"], ["02", "Обнимать, когда тебе грустно"], ["03", "Слушать тебя и поддерживать"], ["04", "Смешить тебя каждый день"]],
  sadButton: "Нажми, если грустно 🥺",
  sadMessage: "Иди сюда 🤍 Всё будет хорошо. Ты самая лучшая, и я всегда рядом.",
  password: "Вита",
  gateTitle: "Мини-квест",
  gateHint: "Чтобы попасть на праздничную страницу, введи пароль: моё имя в твоей любимой форме 💌",
  gateWrong: "Не то 🙈 Попробуй ещё раз",
  gateHint2: "Подсказка: всего 4 буквы, так ты меня называешь 💕",
  vibeHeading: "Твой вайб",
  vibeText: "Тихая ночь, тёплый свет фонарей, первый снег или шум дождя — это про тебя.\nТы умеешь находить красоту в спокойных моментах, и рядом с тобой хочется замедлиться и просто быть.",
  foodHeading: "Твоя любимая еда",
  foodNames: ["Персики 🍑", "Ананасы 🍍"],
  galleryHeading: "Немного милоты для тебя",
  knifeHeading: "Моё главное пожелание",
  knifeText: "Юня, я желаю тебе нож из Valorant — EX.O! Пусть он однажды окажется в твоём арсенале, а каждая катка заканчивается красивой победой.\n\nИ пусть ты никогда не грустишь."
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const KEY = "bday-overrides";
let over = {};
try { over = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { over = {}; }
let C = Object.assign({}, CONFIG, over);

function render() {
  document.documentElement.style.setProperty("--accent", C.accent);
  const t = C.titleTemplate.replace("{name}", C.name);
  document.title = t;
  $("emoji").textContent = C.emoji;
  $("title").textContent = t;
  $("subtitle").textContent = C.subtitle;
  $("msgH").textContent = C.messageHeading;
  $("message").textContent = C.message;
  $("sign").textContent = C.signature;
  $("reasonsH").textContent = C.reasonsHeading;
  $("reasons").innerHTML = "";
  C.reasons.forEach(([n, txt]) => {
    const d = document.createElement("div");
    d.className = "card";
    const b = document.createElement("b"); b.textContent = n;
    d.append(b, document.createTextNode(txt));
    $("reasons").appendChild(d);
  });
  $("wishesH").textContent = C.wishesHeading;
  $("wishes").textContent = C.wishes;
  $("boom").textContent = C.buttonText;
  $("t1").textContent = C.tab1; $("t2").textContent = C.tab2;
  $("galH").textContent = C.galleryHeading; $("knifeH").textContent = C.knifeHeading;
  $("knifeText").textContent = C.knifeText; $("sign2").textContent = C.signature;
  $("t3").textContent = C.tab3; $("foodH").textContent = C.foodHeading; $("sign3").textContent = C.signature;
  $("togH").textContent = C.togglesHeading; $("togMsg").textContent = C.togglesNote;

/* Конфетти */
const cv = $("cv"), ctx = cv.getContext("2d");
let parts = [], run = false;
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();
function boom() {
  const cols = [C.accent, "#ffd166", "#6ec6ff", "#9be564", "#c792ea"];
  for (let i = 0; i < 160; i++) parts.push({x: innerWidth/2, y: innerHeight/2, vx:(Math.random()-.5)*16, vy:Math.random()*-14-2, s:Math.random()*8+4, c:cols[i%cols.length], r:Math.random()*6});
  if (!run) { run = true; tick(); }
}
function tick() {
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    ctx.save(); ctx.translate(p.x, p.y);
    if (p.e) {
      p.vx *= .985; p.vy = p.vy * .985 + .03; p.life--;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      ctx.font = p.s + "px serif"; ctx.textAlign = "center"; ctx.fillText(p.e, 0, 0);
    } else {
      p.vy += .35; p.r += .2; ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*.6);
    }
    ctx.restore();
  });
  parts = parts.filter(p => p.e ? p.life > 0 : p.y < cv.height + 20);
  if (parts.length) requestAnimationFrame(tick); else { run = false; ctx.clearRect(0,0,cv.width,cv.height); }
}
function love(el) {
  const em = ["💋", "❤️", "💖", "💕", "💗", "😘", "🩷"];
  const r = (el || $("boom")).getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  for (let i = 0; i < 45; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.4, v = 4 + Math.random() * 8;
    parts.push({x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 22 + Math.random() * 30, e: em[i % em.length], life: 90 + Math.random() * 60});
  }
  if (!run) { run = true; tick(); }
}
$("boom").onclick = () => love();

/* Лёгкий дождик */
const rc = $("rain"), rx = rc.getContext("2d");
let drops = [], rainOn = true;
const isDark = () => true;
function mkDrop(init) { return {x: Math.random() * (rc.width + 200), y: init ? Math.random() * rc.height : -30, l: 10 + Math.random() * 16, v: 9 + Math.random() * 8, a: .15 + Math.random() * .3}; }
function rainSize() { rc.width = innerWidth; rc.height = innerHeight; drops = Array.from({length: Math.min(150, Math.round(innerWidth * innerHeight / 9000))}, () => mkDrop(true)); }
function rainTick() {
  rx.clearRect(0, 0, rc.width, rc.height);
  if (!rainOn) { requestAnimationFrame(rainTick); return; }
  rx.lineWidth = 1.1;
  const col = isDark() ? "200,220,255" : "110,125,170";
  drops.forEach(d => {
    rx.strokeStyle = "rgba(" + col + "," + d.a + ")"; rx.beginPath(); rx.moveTo(d.x, d.y); rx.lineTo(d.x - d.l * .25, d.y + d.l); rx.stroke();
    d.y += d.v; d.x -= d.v * .25;
    if (d.y > rc.height || d.x < -20) Object.assign(d, mkDrop(false));
  });
  requestAnimationFrame(rainTick);
}
addEventListener("resize", rainSize); rainSize();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) rainTick();

/* Музыка: 4 настроения, синтезируются прямо в браузере (оригинальные, без чужих записей) */
const MODES = [
  {name:"Lo-fi", bpm:76, chords:[[62,65,69,72],[55,59,62,65],[60,64,67,71],[57,60,64,67]], scale:[72,74,76,79,81,84], drums:true, pad:0, stab:true, bass:.16, pl:.65, noise:.012},
  {name:"Колыбельная", bpm:50, chords:[[60,64,67,71],[57,60,64,67],[53,60,64,69],[55,59,62,64]], scale:[72,74,76,79,81,84,86], drums:false, pad:.05, stab:false, bass:.1, pl:.9, noise:0},
  {name:"Мечтательная", bpm:44, chords:[[60,64,67,71,74],[62,66,69,73],[65,69,72,76],[55,62,67,71]], scale:[79,81,83,86,88,91], drums:false, pad:.06, stab:false, bass:.08, pl:.95, noise:0},
  {name:"Дождь", bpm:60, chords:[[57,60,64,67,71],[53,57,60,64],[55,59,62,64,67],[52,55,59,62]], scale:[69,72,74,76,79,81], drums:false, pad:.055, stab:false, bass:.14, pl:.5, noise:.05},
  {name:"Slowed-вальс", bpm:40, chords:[[57,60,64],[55,59,62],[53,57,60],[52,56,59]], scale:[72,74,76], drums:false, pad:.035, stab:false, bass:.09, pl:0, noise:.02, arp:true}
];
let AC, master, bus, drums, NB, ng, musicOn = false, chordIdx = 0, nextT = 0, trackIdx = 4;
let M = MODES[trackIdx], B = 60 / M.bpm;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function key(m, t, dur, vol, att) {
  const o = AC.createOscillator(), h = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), hg = AC.createGain();
  o.type = "sine"; h.type = "triangle"; o.frequency.value = hz(m); h.frequency.value = hz(m) * 2; hg.gain.value = .25;
  o.detune.value = (Math.random() - .5) * 14;
  f.type = "lowpass"; f.frequency.value = 1700;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + (att || .02)); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(f); h.connect(hg); hg.connect(f); f.connect(g); g.connect(bus);
  o.start(t); h.start(t); o.stop(t + dur + .1); h.stop(t + dur + .1);
}
function pluck(m, t) {
  const o = AC.createOscillator(), h = AC.createOscillator(), hg = AC.createGain(), g = AC.createGain();
  o.type = "sine"; o.frequency.value = hz(m); h.type = "sine"; h.frequency.value = hz(m) * 2.76; hg.gain.value = .2;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + 2.6);
  h.connect(hg); hg.connect(g); o.connect(g); g.connect(bus);
  o.start(t); h.start(t); o.stop(t + 2.8); h.stop(t + 2.8);
}
function harp(m, t) {
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = "sawtooth"; o.frequency.value = hz(m);
  f.type = "lowpass"; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(700, t + .5);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .005); g.gain.exponentialRampToValueAtTime(.0008, t + 1.1);
  o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + 1.2);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.001, t + .4);
  o.connect(g); g.connect(drums); o.start(t); o.stop(t + .45);
}
function hit(t, type, freq, vol, dur) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(drums); s.start(t, Math.random()); s.stop(t + dur + .05);
}
function bar(t) {
  const ch = M.chords[chordIdx++ % M.chords.length];
  if (M.pad) ch.forEach(m => key(m, t, B * 4 + 1.5, M.pad, 1.5));
  if (M.stab) { ch.forEach(m => key(m, t, B * 2, .07)); ch.forEach(m => key(m, t + B * 2.5, B * 1.3, .05)); }
  key(ch[0] - 12, t, B * (M.stab ? 1.6 : 3.5), M.bass, M.stab ? .02 : .6);
  if (M.stab) key(ch[0] - 12, t + B * 2.5, B * 1.2, M.bass * .75);
  if (M.drums) {
    kick(t); kick(t + B * 2.5);
    hit(t + B, "bandpass", 1800, .28, .2); hit(t + B * 3, "bandpass", 1800, .28, .2);
    for (let i = 0; i < 8; i++) hit(t + i * B / 2 + (i % 2 ? B * .08 : 0), "highpass", 7500, i % 2 ? .07 : .12, .05);
  }
  if (M.arp) for (let i = 0; i < 8; i++) harp(ch[i % ch.length] + (i % 4 === 3 ? 24 : 12), t + i * B / 2);
  const n = M.drums ? 2 : 4;
  for (let k = 0; k < n; k++) if (Math.random() < M.pl) pluck(M.scale[Math.floor(Math.random() * M.scale.length)], t + Math.floor(Math.random() * 8) * B / 2);
}
function step() {
  if (!AC) return;
  if (!nextT) nextT = AC.currentTime + .15;
  while (nextT < AC.currentTime + 3) { bar(nextT); nextT += B * 4; }
}
function initMusic() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const len = AC.sampleRate * 3, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const rev = AC.createConvolver(); rev.buffer = ir;
  const wet = AC.createGain(); wet.gain.value = .6; rev.connect(wet); wet.connect(master);
  bus = AC.createGain(); const dry = AC.createGain(); dry.gain.value = .7; bus.connect(dry); dry.connect(master); bus.connect(rev);
  const dl = AC.createDelay(); dl.delayTime.value = .55; const fb = AC.createGain(); fb.gain.value = .33;
  bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(rev);
  drums = AC.createGain(); drums.gain.value = .55; drums.connect(master);
  NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = NB.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = NB; ns.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3200; bp.Q.value = .4;
  ng = AC.createGain(); ng.gain.value = M.noise; ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start();
  step(); setInterval(step, 500);
}
function setMusic(on) {
  try {
    if (!AC) { if (!on) return; initMusic(); }
    AC.resume();
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.linearRampToValueAtTime(on ? .6 : 0, AC.currentTime + 1.5);
    musicOn = on; $("mus").textContent = on ? "🎵" : "🔇";
  } catch (e) {}
}
function setTrack(i) {
  trackIdx = i; M = MODES[i]; B = 60 / M.bpm; chordIdx = 0;
  if (AC) { nextT = AC.currentTime + .4; ng.gain.value = M.noise; }
  const t = $("toast"); t.textContent = "🎶 " + M.name; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200);
}
$("mus").onclick = () => setMusic(!musicOn);
$("trk").onclick = () => { setTrack((trackIdx + 1) % MODES.length); if (!musicOn) setMusic(true); };
$("mus").textContent = "🔇";

/* Мини-квест: пароль на входе */
const G = $("gate");
$("gTitle").textContent = C.gateTitle; $("gHint").textContent = C.gateHint;
document.body.style.overflow = "hidden";
let tries = 0;
const norm = x => x.trim().toLowerCase().replace(/ё/g, "е");
function unlock() {
  G.classList.add("open"); document.body.style.overflow = "";
  boom(); setMusic(true); setTimeout(() => { G.hidden = true; }, 700);
}
$("gGo").onclick = () => {
  if (norm($("gIn").value) === norm(C.password)) { unlock(); return; }
  tries++; $("gMsg").textContent = tries >= 3 ? C.gateHint2 : C.gateWrong;
  const b = $("gBox"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
};
$("gIn").onkeydown = e => { if (e.key === "Enter") $("gGo").onclick(); };
